<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transaction Risk Scoring & Decision Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6 font-sans">
  <div class="max-w-6xl mx-auto space-y-8">
    
    <!-- Header -->
    <header class="border-b border-slate-800 pb-4 flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold text-indigo-400">Transaction Risk Scoring System</h1>
        <p class="text-sm text-slate-400">XGBoost Risk Engine • SHAP Feature Attribution • Gemini LLM Audit</p>
      </div>
      <span class="bg-indigo-900/50 text-indigo-300 text-xs px-3 py-1 rounded-full border border-indigo-700">API Active</span>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
      
      <!-- Input Panel -->
      <div class="lg:col-span-5 bg-slate-800/60 p-6 rounded-xl border border-slate-700/50 h-fit space-y-6">
        
        <div>
          <label class="block text-xs uppercase text-slate-400 font-bold mb-2">Preset Scenarios</label>
          <div class="grid grid-cols-3 gap-2">
            <button type="button" onclick="applyPreset('legit')" class="py-2 px-3 bg-slate-700 hover:bg-slate-600 rounded text-xs font-semibold text-slate-200 transition">Legitimate</button>
            <button type="button" onclick="applyPreset('drain')" class="py-2 px-3 bg-amber-950/60 hover:bg-amber-900/60 text-amber-300 rounded text-xs font-semibold border border-amber-800 transition">Account Drain</button>
            <button type="button" onclick="applyPreset('ghost')" class="py-2 px-3 bg-red-950/60 hover:bg-red-900/60 text-red-300 rounded text-xs font-semibold border border-red-800 transition">Ghost Transfer</button>
          </div>
        </div>

        <form id="riskForm" onsubmit="evaluateRisk(event)" class="space-y-4">
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs text-slate-400 mb-1">Time Step</label>
              <input type="number" id="step" value="1" min="1" required class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none" />
            </div>
            <div>
              <label class="block text-xs text-slate-400 mb-1">Transaction Type</label>
              <select id="is_transfer" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none">
                <option value="1">TRANSFER</option>
                <option value="0">CASH_OUT / OTHER</option>
              </select>
            </div>
          </div>

          <div>
            <label class="block text-xs text-slate-400 mb-1">Amount (USD)</label>
            <input type="number" step="0.01" id="amount" value="180000.00" required class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none" />
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs text-slate-400 mb-1">Sender Old Balance</label>
              <input type="number" step="0.01" id="oldbalanceOrg" value="180000.00" required class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none" />
            </div>
            <div>
              <label class="block text-xs text-slate-400 mb-1">Sender New Balance</label>
              <input type="number" step="0.01" id="newbalanceOrig" value="0.00" required class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none" />
            </div>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs text-slate-400 mb-1">Receiver Old Balance</label>
              <input type="number" step="0.01" id="oldbalanceDest" value="0.00" required class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none" />
            </div>
            <div>
              <label class="block text-xs text-slate-400 mb-1">Receiver New Balance</label>
              <input type="number" step="0.01" id="newbalanceDest" value="0.00" required class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none" />
            </div>
          </div>

          <button type="submit" id="submitBtn" class="w-full mt-4 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 px-4 rounded-lg transition duration-200 flex justify-center items-center gap-2">
            Evaluate
          </button>
        </form>
      </div>

      <!-- Results Panel -->
      <div class="lg:col-span-7 space-y-6">
        
        <!-- Default State Message -->
        <div id="placeholder" class="bg-slate-800/30 border border-dashed border-slate-700 p-12 rounded-xl text-center text-slate-500">
          Select a preset or enter parameters, then click <span class="text-indigo-400 font-semibold">Evaluate</span> to generate the assessment.
        </div>

        <!-- Hidden Results Container -->
        <div id="results" class="hidden space-y-6">
          
          <!-- Score Card -->
          <div class="bg-slate-800/60 p-6 rounded-xl border border-slate-700/50 grid grid-cols-2 gap-4 items-center">
            <div>
              <div class="text-xs text-slate-400 uppercase font-semibold">Risk Decision</div>
              <div id="decisionBadge" class="text-xl font-bold mt-1">---</div>
            </div>
            <div class="text-right">
              <div class="text-xs text-slate-400 uppercase font-semibold">Risk Probability</div>
              <div id="riskScore" class="text-3xl font-extrabold text-indigo-400 mt-1">0.0%</div>
            </div>
          </div>

          <!-- SHAP Contributions -->
          <div class="bg-slate-800/60 p-6 rounded-xl border border-slate-700/50 space-y-3">
            <h3 class="text-sm font-semibold text-slate-300">SHAP Feature Contributions</h3>
            <div id="shapList" class="space-y-2 text-xs"></div>
          </div>

          <!-- LLM Executive Audit -->
          <div class="bg-slate-800/60 p-6 rounded-xl border border-slate-700/50 space-y-3">
            <h3 class="text-sm font-semibold text-indigo-300">Gemini Compliance Audit Summary</h3>
            <div id="llmAudit" class="prose prose-invert prose-sm text-slate-300 max-w-none"></div>
          </div>

        </div>

      </div>

    </div>
  </div>

  <script>
    const presets = {
      legit: {
        step: 10,
        is_transfer: 0,
        amount: 2500.00,
        oldbalanceOrg: 15000.00,
        newbalanceOrig: 12500.00,
        oldbalanceDest: 5000.00,
        newbalanceDest: 7500.00
      },
      drain: {
        step: 1,
        is_transfer: 1,
        amount: 350000.00,
        oldbalanceOrg: 350000.00,
        newbalanceOrig: 0.00,
        oldbalanceDest: 0.00,
        newbalanceDest: 0.00
      },
      ghost: {
        step: 100,
        is_transfer: 1,
        amount: 1000000.00,
        oldbalanceOrg: 1000000.00,
        newbalanceOrig: 0.00,
        oldbalanceDest: 50000.00,
        newbalanceDest: 50000.00
      }
    };

    function applyPreset(key) {
      const data = presets[key];
      if (!data) return;

      document.getElementById("step").value = data.step;
      document.getElementById("is_transfer").value = data.is_transfer;
      document.getElementById("amount").value = data.amount;
      document.getElementById("oldbalanceOrg").value = data.oldbalanceOrg;
      document.getElementById("newbalanceOrig").value = data.newbalanceOrig;
      document.getElementById("oldbalanceDest").value = data.oldbalanceDest;
      document.getElementById("newbalanceDest").value = data.newbalanceDest;

      // Visual indicator animation without auto-submitting
      const form = document.getElementById("riskForm");
      form.classList.add("ring-2", "ring-indigo-500");
      setTimeout(() => form.classList.remove("ring-2", "ring-indigo-500"), 400);
    }

    async function evaluateRisk(event) {
      event.preventDefault();

      const submitBtn = document.getElementById("submitBtn");
      const placeholder = document.getElementById("placeholder");
      const results = document.getElementById("results");

      submitBtn.disabled = true;
      submitBtn.innerText = "Evaluating...";

      const payload = {
        step: parseInt(document.getElementById("step").value),
        is_transfer: parseInt(document.getElementById("is_transfer").value),
        amount: parseFloat(document.getElementById("amount").value),
        oldbalanceOrg: parseFloat(document.getElementById("oldbalanceOrg").value),
        newbalanceOrig: parseFloat(document.getElementById("newbalanceOrig").value),
        oldbalanceDest: parseFloat(document.getElementById("oldbalanceDest").value),
        newbalanceDest: parseFloat(document.getElementById("newbalanceDest").value)
      };

      try {
        const response = await fetch("http://127.0.0.1:8000/api/v1/assess", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          throw new Error(`Server returned status ${response.status}`);
        }

        const data = await response.json();

        // Render decision badge
        const badge = document.getElementById("decisionBadge");
        badge.innerText = data.decision;
        if (data.decision === "BLOCK TRANSACTION") {
          badge.className = "text-xl font-bold mt-1 text-red-400";
        } else if (data.decision === "FLAG FOR REVIEW") {
          badge.className = "text-xl font-bold mt-1 text-amber-400";
        } else {
          badge.className = "text-xl font-bold mt-1 text-emerald-400";
        }

        // Render score
        document.getElementById("riskScore").innerText = (data.risk_score * 100).toFixed(2) + "%";

        // Render SHAP factors
        const shapContainer = document.getElementById("shapList");
        shapContainer.innerHTML = "";
        data.shap_contributions.slice(0, 5).forEach(item => {
          const isPositive = item.SHAP_Contribution > 0;
          const barWidth = Math.min(Math.abs(item.SHAP_Contribution) * 100, 100).toFixed(1);
          
          shapContainer.innerHTML += `
            <div class="space-y-1">
              <div class="flex justify-between">
                <span class="font-mono text-slate-300">${item.Feature} (${item.Feature_Value})</span>
                <span class="${isPositive ? 'text-red-400' : 'text-emerald-400'} font-semibold">${item.SHAP_Contribution > 0 ? '+' : ''}${item.SHAP_Contribution.toFixed(4)}</span>
              </div>
              <div class="w-full bg-slate-900 h-1.5 rounded-full overflow-hidden">
                <div class="h-full ${isPositive ? 'bg-red-500' : 'bg-emerald-500'}" style="width: ${barWidth}%"></div>
              </div>
            </div>
          `;
        });

        // Render Gemini markdown
        document.getElementById("llmAudit").innerHTML = marked.parse(data.llm_audit);

        // Show results
        placeholder.classList.add("hidden");
        results.classList.remove("hidden");

      } catch (err) {
        alert("Evaluation failed: " + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "Evaluate";
      }
    }
  </script>
</body>
</html>
